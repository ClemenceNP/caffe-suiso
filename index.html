<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caffè Suiso — Outils</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5EFE0; color: #2C2C2A; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }
  header { text-align: center; margin-bottom: 3rem; }
  .logo-img { width: 110px; height: 110px; object-fit: contain; margin: 0 auto 1rem; display: block; }
  .tagline { font-size: 13px; color: #888780; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; width: 100%; max-width: 640px; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,.08); padding: 1.25rem 1.5rem; text-decoration: none; color: inherit; transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column; gap: 6px; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .card-icon { width: 32px; height: 32px; border-radius: 8px; background: #E1F5EE; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  .card-icon svg { width: 16px; height: 16px; stroke: #0F6E56; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card-title { font-size: 15px; font-weight: 500; color: #1B2A4A; }
  .card-desc { font-size: 12px; color: #888780; line-height: 1.4; }
  .card-lang { font-size: 11px; color: #B4B2A9; margin-top: 4px; }
  .card.soon { opacity: .5; pointer-events: none; }
  .badge { display: inline-block; font-size: 10px; background: #E8E4D8; color: #888780; border-radius: 4px; padding: 2px 6px; margin-top: 4px; }
  footer { margin-top: 3rem; font-size: 11px; color: #B4B2A9; text-align: center; }
</style>
</head>
<body>
<header>
  <img class="logo-img" src="./CS_Logo.png" alt="Caffè Suiso">
  <p class="tagline">Outils internes · Strumenti interni</p>
</header>
<div class="grid">
  <a class="card" href="./dashboard/">
    <div class="card-icon">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <p class="card-title">Dashboard ventes</p>
    <p class="card-desc">Importer un export CSV Shopify et visualiser les ventes mensuelles vs N-1.</p>
    <p class="card-lang">FR · IT</p>
  </a>
  <div class="card soon">
    <div class="card-icon" style="background:#F5EFE0;">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </div>
    <p class="card-title">Rapport PDF</p>
    <p class="card-desc">Générer un rapport mensuel mis en page automatiquement.</p>
    <span class="badge">Bientôt</span>
  </div>
</div>
<footer>Caffè Suiso · Curio, Ticino · <span id="yr"></span></footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
